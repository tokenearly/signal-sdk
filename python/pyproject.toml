[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tokenearly-signal"
version = "0.1.0"
description = "Python SDK for the Tokenearly Signal API: push crypto signals that Tokenearly delivers to subscribers on Telegram, Bark, PushDeer, WeCom, DingTalk, Feishu and Webhook."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tokenearly" }]
keywords = ["crypto", "cryptocurrency", "alerts", "signals", "token listing", "exchange announcements", "tokenearly", "telegram"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = ["requests>=2.28"]

[project.optional-dependencies]
async = ["aiohttp>=3.8"]
dev = ["pytest>=7", "aiohttp>=3.8"]

[project.urls]
Homepage = "https://tokenearly.com"
Repository = "https://github.com/tokenearly/signal-sdk"
Documentation = "https://github.com/tokenearly/signal-sdk/blob/main/docs/api.md"
Issues = "https://github.com/tokenearly/signal-sdk/issues"

[tool.setuptools.packages.find]
include = ["tokenearly_signal*"]

[tool.setuptools.package-data]
tokenearly_signal = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
